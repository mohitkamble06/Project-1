<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch." />
  <title>Contact | Hello, User!</title>
  <style>
    :root { --ink:#17203d; --muted:#66708c; --purple:#7255f6; --pink:#e54fa8; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:28px; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 90% 10%,#fbd6ed 0,transparent 25%),#f7f5ff; }
    .shell { width:min(100%,960px); margin:auto; }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 0 42px; }
    .brand { color:var(--ink); font-size:1.05rem; font-weight:850; text-decoration:none; } .brand span { color:var(--purple); }
    nav { display:flex; gap:18px; } nav a { color:var(--muted); font-size:.92rem; font-weight:750; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--purple); }
    main { display:grid; grid-template-columns:.9fr 1.1fr; gap:clamp(32px,7vw,90px); align-items:center; min-height:calc(100vh - 150px); }
    .eyebrow { margin:0 0 12px; color:var(--purple); font-size:.78rem; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.7rem,7vw,5.1rem); line-height:1; letter-spacing:-.07em; } h1 span { color:transparent; background:linear-gradient(100deg,var(--purple),var(--pink)); background-clip:text; -webkit-background-clip:text; }
    .intro { color:var(--muted); font-size:1.12rem; line-height:1.7; }
    form { padding:30px; border:1px solid rgba(255,255,255,.9); border-radius:28px; background:rgba(255,255,255,.78); box-shadow:0 22px 55px rgba(83,62,155,.13); }
    label { display:block; margin:0 0 7px; color:var(--ink); font-size:.88rem; font-weight:800; } input,textarea { width:100%; margin:0 0 18px; padding:13px 14px; color:var(--ink); font:inherit; border:1px solid #ded9ec; border-radius:12px; background:#fff; outline:none; } input:focus,textarea:focus { border-color:var(--purple); box-shadow:0 0 0 3px #e6e1ff; } textarea { min-height:105px; resize:vertical; }
    button { width:100%; padding:14px; color:#fff; font:inherit; font-weight:800; border:0; border-radius:12px; cursor:pointer; background:linear-gradient(105deg,var(--purple),var(--pink)); } button:hover { filter:brightness(1.05); } #sent { min-height:1.3em; margin:14px 0 0; color:var(--purple); font-size:.93rem; font-weight:750; text-align:center; }
    @media (max-width:650px) { body { padding:20px; } header { padding-bottom:28px; } main { grid-template-columns:1fr; min-height:auto; padding:32px 0; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="hello-user.html">hello<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="hello-user.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </header>
    <main>
      <section>
        <p class="eyebrow">Say hello</p>
        <h1>Let’s make<br>something <span>lovely.</span></h1>
        <p class="intro">Have an idea, a question, or simply a good thought to share? Drop a note below. We’d be delighted to hear from you.</p>
      </section>
      <form id="contact-form">
        <label for="name">Your name</label><input id="name" name="name" autocomplete="name" placeholder="Jane Doe" required />
        <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="jane@example.com" required />
        <label for="message">Your message</label><textarea id="message" name="message" placeholder="What’s on your mind?" required></textarea>
        <button type="submit">Send your message →</button><p id="sent" aria-live="polite"></p>
      </form>
    </main>
  </div>
  <script>
    document.getElementById('contact-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.getElementById('sent').textContent = 'Thanks! Your message is ready to be sent.';
    });
  </script>
</body>
</html>
